<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Admin Password</title>

   
<style>
    body {
        font-family: Arial, sans-serif;
        background: #0b2545;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
        box-sizing: border-box;
    }

    .reset-box {
        background: white;
        padding: 35px;
        border-radius: 15px;
        width: 320px;
        max-width: 100%;
        text-align: center;
    }

    h2 {
        color: #0b2545;
    }

    input, button {
        width: 100%;
        padding: 12px;
        margin-top: 15px;
        box-sizing: border-box;
        border-radius: 7px;
    }

    input {
        border: 1px solid #ccc;
    }

    button {
        background: #d4af37;
        border: none;
        font-weight: bold;
        cursor: pointer;
    }

    #message {
        margin-top: 15px;
        overflow-wrap: anywhere;
    }
</style>
</head>

<body>

<div class="reset-box">

    <h2>Admin Password</h2>

    <!-- RECOVERY EMAIL SECTION -->
    <div id="emailSection">
        <p>Enter your admin email to receive a password recovery link.</p>

        <input type="email" id="adminEmail"
            placeholder="Admin Email">

        <button id="sendRecoveryButton">
            Send Recovery Link
        </button>
    </div>

    <!-- NEW PASSWORD SECTION -->
    <div id="passwordSection" style="display:none;">

        <p>Enter your new admin password.</p>

        <input type="password" id="newPassword"
            placeholder="New Password">

        <input type="password" id="confirmPassword"
            placeholder="Confirm Password">

        <button id="resetButton">
            Update Password
        </button>
    </div>

    <p id="message"></p>

</div>

<!-- SUPABASE CONNECTION -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = "https://jvvmuymindxrzqtjfgcw.supabase.co";

const SUPABASE_KEY = "YOUR_EXISTING_PUBLISHABLE_KEY";

const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const emailSection = document.getElementById("emailSection");
const passwordSection = document.getElementById("passwordSection");
const message = document.getElementById("message");

// CHECK PASSWORD RECOVERY SESSION
supabaseClient.auth.onAuthStateChange((event, session) => {

    if (event === "PASSWORD_RECOVERY" && session) {

        emailSection.style.display = "none";
        passwordSection.style.display = "block";

        message.textContent = "Enter your new password.";

    }

});

// SEND RECOVERY EMAIL
document.getElementById("sendRecoveryButton").addEventListener("click", async function () {

    const email = document.getElementById("adminEmail").value.trim();

    if (!email) {
        message.textContent = "Please enter your admin email.";
        return;
    }

    message.textContent = "Sending recovery link...";

    const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
        redirectTo: "https://taupe-fenglisu-7adfed.netlify.app/reset-password.html"
    });

    if (error) {
        message.textContent = error.message;
    } else {
        message.textContent = "Recovery link sent! Please check your email.";
    }

});

// UPDATE PASSWORD
document.getElementById("resetButton").addEventListener("click", async function () {

    const newPassword = document.getElementById("newPassword").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (newPassword.length < 8) {
        message.textContent = "Password must contain at least 8 characters.";
        return;
    }

    if (newPassword !== confirmPassword) {
        message.textContent = "Passwords do not match!";
        return;
    }

    message.textContent = "Updating password...";

    const { error } = await supabaseClient.auth.updateUser({
        password: newPassword
    });

    if (error) {
        message.textContent = error.message;
    } else {
        message.textContent = "Password updated successfully!";
    }

});

</script>

</body>
</html>
